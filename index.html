<title>HK Money — כניסה</title>
<style>
:root{--n900:#061a2c;--n800:#0a2740;--navy:#0c4068;--blue:#39abe2;--salmon:#e48375;--ink:#eef6fc;--muted:#9fbdd4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Rubik','Assistant','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);
background:radial-gradient(120% 90% at 88% 8%,rgba(57,171,226,.15),transparent 55%),radial-gradient(110% 80% at 6% 96%,rgba(12,64,104,.5),transparent 60%),linear-gradient(160deg,var(--n800),var(--n900));}
.box{width:min(400px,92vw);text-align:center;padding:2rem}
.mark{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;margin:0 auto 1.4rem;background:linear-gradient(140deg,var(--blue),var(--navy));color:#fff;font-weight:800;font-size:1.7rem;box-shadow:0 16px 40px -14px rgba(57,171,226,.7)}
h1{font-size:1.5rem;margin:0 0 .4rem;font-weight:800}
p{margin:0 0 1.6rem;color:var(--muted);font-size:.95rem}
form{display:flex;flex-direction:column;gap:.8rem}
input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:.9rem 1.1rem;font-size:1.05rem;color:var(--ink);text-align:center;font-family:inherit;letter-spacing:.06em;direction:ltr}
input:focus{outline:2px solid var(--blue);outline-offset:2px;border-color:transparent}
button{background:linear-gradient(140deg,var(--blue),#2a8fc4);border:none;border-radius:12px;padding:.9rem;font-size:1.05rem;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--salmon);font-size:.9rem;min-height:1.3em;margin-top:.7rem}
.foot{margin-top:2rem;font-size:.75rem;color:var(--muted);opacity:.7}
</style>
</head>

const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(DATA.iv)},key,b2a(DATA.ct));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw,silent){
  const go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;err.textContent='';
  try{
    const html=await unlock(pw);
    try{sessionStorage.setItem('hkpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    go.disabled=false;
    if(!silent){err.textContent='סיסמה שגויה — נסה שוב';}
    try{sessionStorage.removeItem('hkpw');}catch(e2){}
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();tryPw(document.getElementById('pw').value,false);});
try{const s=sessionStorage.getItem('hkpw');if(s)tryPw(s,true);}catch(e){}
