const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(DATA.iv)},key,b2a(DATA.ct));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw,silent){
  const go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;err.textContent='';
  try{
    const html=await unlock(pw);
    try{sessionStorage.setItem('hkpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    go.disabled=false;
    if(!silent){err.textContent='סיסמה שגויה — נסה שוב';}
    try{sessionStorage.removeItem('hkpw');}catch(e2){}
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();tryPw(document.getElementById('pw').value,false);});
try{const s=sessionStorage.getItem('hkpw');if(s)tryPw(s,true);}catch(e){}
</script>
